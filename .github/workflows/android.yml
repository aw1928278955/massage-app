name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 產生網頁檔
        run: python3 tools/build_www.py

      - name: 安裝 Capacitor 並建立 Android 專案
        run: |
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: 換上圖示
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          cp -r assets/android-res/. "$RES"/

      - name: 同步網頁到 Android
        run: npx cap sync android

      - name: 使用固定簽章金鑰（日後可直接覆蓋安裝更新）
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: 打包 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 發佈到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          APK="massage-hours-build-${N}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "build-${N}" "$APK" \
            --title "build-${N}" \
            --notes "課堂時數抽成記錄 build ${N}" \
            --latest
